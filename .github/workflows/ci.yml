name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      environnement:
        description: "Environnement cible"
        type: choice
        options: [recette, production]
        default: recette
      message:
        description: "Message à afficher"
        type: string
        required: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  syntaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe des fichiers source
        run: node --check src/salutation.js