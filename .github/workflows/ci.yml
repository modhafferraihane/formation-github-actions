name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      environnement:
        description: "Environnement cible"
        type: choice
        options: [recette, production]
        default: recette
      message:
        description: "Message à afficher"
        type: string
        required: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  syntaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe des fichiers source
        run: node --check src/salutation.js

  livrable:
    runs-on: ubuntu-latest
    needs: [tests, syntaxe, version]
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'archive
        run: |
          mkdir -p dist
          tar -czf dist/salutation.tar.gz src package.json
          ls -lh dist
      - name: Afficher la version construite
        run: echo "Archive de la version ${{ needs.version.outputs.numero }}"
      - name: Résumé
        run: |
          {
            echo "### Livrable"
            echo ""
            echo "| Champ | Valeur |"
            echo "|---|---|"
            echo "| Version | ${{ needs.version.outputs.numero }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Taille | $(du -h dist/salutation.tar.gz | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

  version:
    runs-on: ubuntu-latest
    outputs:
      numero: ${{ steps.lire.outputs.numero }}
    steps:
      - uses: actions/checkout@v4
      - name: Lire la version du package
        id: lire
        run: echo "numero=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  image:
    runs-on: ubuntu-latest
    needs: livrable
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t salutation:${{ github.sha }} .

      - name: Vérifier que le conteneur démarre
        run: |
          docker run -d -p 3000:3000 --name essai salutation:${{ github.sha }}
          sleep 2
          curl -sf http://localhost:3000
          docker rm -f essai

      - name: Se connecter à ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publier l'image
        run: |
          docker tag salutation:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}